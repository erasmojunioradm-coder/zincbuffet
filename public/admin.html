<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZINC — Administração</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#07100c;--panel:#0d1713;--gold:#d5b56c;--hover:#f2d899;--txt:#fffdf7;--muted:#a1aaa4;--line:rgba(255,255,255,.1);--danger:#7a2727}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,sans-serif}.wrap{width:min(1240px,calc(100% - 24px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:rgba(7,16,12,.92);backdrop-filter:blur(14px);z-index:10}.brand{font-family:"Cormorant Garamond",serif;font-size:36px;letter-spacing:7px;color:var(--hover)}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;margin:18px 0}.side,.content,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.side{height:max-content;position:sticky;top:92px}.side button,.btn{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#12221b;color:#fff;cursor:pointer;margin-bottom:8px;text-align:left}.btn.primary{background:var(--gold);color:#111;font-weight:800}.btn.danger{background:var(--danger)}.btn.success{background:#1c5b3a}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}input,select,textarea{padding:12px;border-radius:10px;border:1px solid var(--line);background:#08110d;color:#fff;width:100%}textarea{min-height:100px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:15px;border:1px solid var(--line);border-radius:15px;background:#0a130f}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#040705;aspect-ratio:1;position:relative}.thumb.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(213,181,108,.18)}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb .check{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;width:30px;height:30px;cursor:pointer}.thumb .actions{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px}.thumb .actions button{flex:1;border:0;border-radius:8px;background:rgba(0,0,0,.75);color:#fff;padding:7px;cursor:pointer}.thumb .badge{position:absolute;right:6px;top:6px;border-radius:999px;padding:5px 8px;background:rgba(0,0,0,.7);font-size:10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.toolbar .btn{width:auto;margin:0}.progress{height:9px;border-radius:99px;background:#16241d;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}.status{color:var(--muted);font-size:12px}.notice{padding:10px 12px;border-radius:10px;background:#0b1913;border:1px solid var(--line);font-size:12px;margin:10px 0}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(430px,calc(100% - 28px));padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#11251b;border:1px solid rgba(213,181,108,.4);padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}.preview{border:1px solid var(--line);border-radius:16px;min-height:260px;background:#050706 center/cover no-repeat;display:flex;align-items:center;padding:26px;margin-top:8px}.preview h2{font:500 54px/0.9 "Cormorant Garamond",serif;margin:0;color:var(--heading,#fffdf7)}.colorgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.color{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}.color input[type=color]{width:56px;height:40px;padding:0;border:0;background:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0b1511;border:1px solid var(--line);border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:1px solid var(--line);color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.cards{grid-template-columns:1fr}}@media(max-width:620px){.thumbs{grid-template-columns:repeat(2,1fr)}.colorgrid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('zincToken')||'',data={events:[],settings:{}};let selectedEvent=null,selectedAlbum=null,selectedIds=new Set(),draft={};
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2500)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);if(r.status===401){sessionStorage.removeItem('zincToken');token='';loginView();throw new Error('unauthorized')}return r.json()}
async function refresh(){const r=await fetch('/api/content',{cache:'no-store'});if(!r.ok)throw new Error('content');data=await r.json();draft=JSON.parse(JSON.stringify(data.settings||{}));render()}
function loginView(){app.innerHTML=`<div class="login"><form class="loginbox" id="login"><div class="brand">ZINC</div><p class="status">Painel de administração</p><div class="field"><label>Usuário</label><input id="u" autocomplete="username" value="maitane"></div><div class="field"><label>Senha</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn primary" type="submit">ENTRAR</button></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const x=await r.json();if(!r.ok)return toast(x.error||'Falha no login');token=x.token;sessionStorage.setItem('zincToken',token);refresh().catch(()=>toast('Falha ao carregar o painel.'))}}
function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand">ZINC</div><div style="display:flex;gap:8px"><button class="btn" style="width:auto;margin:0" id="view">👁 Ver site</button><button class="btn" style="width:auto;margin:0" id="logout">Sair</button></div></div><div class="layout"><aside class="side"><button class="btn primary" id="dashboard">🏠 Dashboard</button><button class="btn" id="appearance">🎨 Aparência</button><button class="btn" id="newEvent">🎉 Novo evento</button><button class="btn" id="health">🩺 Saúde do site</button><div id="eventButtons"></div><hr style="border-color:var(--line)"><div class="status">Tudo fica salvo no servidor. Fotos e vídeos não ficam presos ao seu navegador.</div></aside><section class="content" id="workspace"></section></div></div>`;$('#view').onclick=()=>window.open('/','_blank');$('#logout').onclick=logout;$('#dashboard').onclick=renderDashboard;$('#appearance').onclick=renderAppearance;$('#newEvent').onclick=createEvent;$('#health').onclick=renderHealth;const eb=$('#eventButtons');data.events.forEach(e=>{const b=document.createElement('button');b.className='btn';b.textContent=e.name;b.onclick=()=>selectEvent(e.id);eb.appendChild(b)});renderDashboard()}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}sessionStorage.removeItem('zincToken');token='';loginView()}
function renderDashboard(){selectedEvent=null;selectedAlbum=null;$('#workspace').innerHTML=`<h2>Dashboard</h2><p class="status">Administre o site sem depender de armazenamento local do navegador.</p><div class="cards"><div class="card"><strong>${data.events.length}</strong><div class="status">eventos</div></div><div class="card"><strong>${data.events.reduce((n,e)=>n+(e.albums||[]).reduce((x,a)=>x+a.media.length,0),0)}</strong><div class="status">mídias</div></div><div class="card"><strong>${data.events.reduce((n,e)=>n+(e.albums||[]).filter(a=>a.published).length,0)}</strong><div class="status">álbuns publicados</div></div><div class="card"><strong>${data.quotes?.length||0}</strong><div class="status">orçamentos</div></div></div><div class="notice">Use <b>Aparência</b> para editar a capa, cores e tipografia. Use um evento para organizar álbuns, fotos e vídeos.</div>`}
function renderHealth(){const w=$('#workspace');w.innerHTML='<h2>Saúde do site</h2><div id="healthBox" class="notice">Verificando...</div>';fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(x=>w.querySelector('#healthBox').innerHTML=`🟢 Servidor online<br>🟢 Armazenamento: ${esc(x.storage)}<br>🟢 Conteúdo: ${x.content?'OK':'ERRO'}<br><span class="status">${new Date(x.time).toLocaleString('pt-BR')}</span>`).catch(()=>w.querySelector('#healthBox').textContent='🔴 Não foi possível consultar o servidor.')}
function renderAppearance(){const s=draft;const t=s.theme||{},f=s.font||{},h=s.hero||{};$('#workspace').innerHTML=`<h2>🎨 Aparência</h2><p class="status">Altere o visual sem mexer no código. As mudanças são salvas como rascunho e só ficam públicas depois de publicar.</p><div class="panel"><h3>Capa principal</h3><div class="preview" id="coverPreview" style="background-image:${h.image?`linear-gradient(90deg,rgba(2,5,4,.76),rgba(2,5,4,.25)),url('${h.image}')`:'none'};background-position:${h.position||'center'}"><div><div class="status">ZINC — BUFFET & EVENTOS</div><h2>Momentos que ficam<br>para sempre.</h2></div></div><div class="toolbar"><label class="btn" style="width:auto">📷 Escolher capa<input id="coverFile" type="file" accept="image/*" hidden></label><button class="btn" style="width:auto" id="resetCover">↩ Restaurar capa original</button></div><div class="field"><label>Posição da capa</label><select id="heroPosition"><option>center</option><option>top</option><option>bottom</option><option>left</option><option>right</option></select></div></div><div class="panel"><h3>Paleta</h3><div class="colorgrid">${colorField('primary','Cor principal',t.primary)}${colorField('primaryHover','Cor ao passar',t.primaryHover)}${colorField('bg','Fundo',t.bg)}${colorField('bg2','Fundo secundário',t.bg2)}${colorField('card','Cards',t.card)}${colorField('heading','Títulos',t.heading)}${colorField('text','Texto',t.text)}${colorField('muted','Texto secundário',t.muted)}</div><div class="toolbar"><button class="btn" style="width:auto" id="themeOriginal">ZINC Original</button><button class="btn" style="width:auto" id="themeLuxury">Tema Luxo</button><button class="btn" style="width:auto" id="themeModern">Tema Moderno</button></div></div><div class="panel"><h3>Tipografia</h3><div class="field"><label>Fonte dos títulos</label><select id="fontHeading"><option>Cormorant Garamond</option><option>Playfair Display</option><option>Lora</option><option>Georgia</option></select></div><div class="field"><label>Fonte dos textos</label><select id="fontBody"><option>Manrope</option><option>Montserrat</option><option>Poppins</option><option>Inter</option></select></div></div><div class="toolbar"><button class="btn primary" style="width:auto" id="saveAppearance">💾 SALVAR ALTERAÇÕES</button><button class="btn success" style="width:auto" id="publishAppearance">🌐 PUBLICAR APARÊNCIA</button><button class="btn" style="width:auto" id="viewAppearance">👁 VER SITE</button></div>`;$('#heroPosition').value=h.position||'center';$('#fontHeading').value=f.heading||'Cormorant Garamond';$('#fontBody').value=f.body||'Manrope';document.querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{draft.theme[draftKey(i.dataset.color)]=i.value;updatePreview()});$('#heroPosition').onchange=e=>{draft.hero.position=e.target.value;updatePreview()};$('#coverFile').onchange=e=>uploadCover(e.target.files[0]);$('#resetCover').onclick=()=>{draft.hero.image='';draft.hero.published=false;updatePreview();toast('A capa original foi restaurada no rascunho. Salve para manter.')};$('#saveAppearance').onclick=saveAppearance;$('#publishAppearance').onclick=publishAppearance;$('#viewAppearance').onclick=()=>window.open('/','_blank');$('#themeOriginal').onclick=()=>{draft.theme={primary:'#C9A45A',primaryHover:'#F2D899',bg:'#050706',bg2:'#09110D',card:'#0D1713',heading:'#FFFDF7',text:'#D8D2C7',muted:'#9AA29C',line:'rgba(255,255,255,.10)'};syncColorInputs();updatePreview()};$('#themeLuxury').onclick=()=>{draft.theme={...draft.theme,primary:'#C8A96B',primaryHover:'#F7E6B6',bg:'#080808',bg2:'#14100C',card:'#17110B',heading:'#FFF7E6',text:'#E8DDCB',muted:'#B9AA94'};syncColorInputs();updatePreview()};$('#themeModern').onclick=()=>{draft.theme={...draft.theme,primary:'#8AC7B1',primaryHover:'#BEE8D8',bg:'#061011',bg2:'#0A181A',card:'#0E2022',heading:'#F4FFFC',text:'#D6E8E3',muted:'#92AAA4'};syncColorInputs();updatePreview()};updatePreview()}
function colorField(k,l,v){return `<div class="color"><input type="color" value="${toHex(v)}" data-color="${k}"><div><strong>${l}</strong><div class="status">${v||''}</div></div></div>`}function draftKey(k){return k}function toHex(v){if(/^#[0-9a-f]{6}$/i.test(v||''))return v;return '#888888'}function syncColorInputs(){document.querySelectorAll('[data-color]').forEach(i=>{i.value=toHex(draft.theme[i.dataset.color])})}function updatePreview(){const p=$('#coverPreview');if(!p)return;p.style.backgroundImage=draft.hero.image?`linear-gradient(90deg,rgba(2,5,4,.76),rgba(2,5,4,.25)),url('${draft.hero.image}')`:'none';p.style.backgroundPosition=draft.hero.position||'center'}
async function uploadCover(file){if(!file)return;const fd=new FormData();fd.append('file',file);toast('Enviando capa...');const r=await api('/api/settings/hero',{method:'POST',body:fd});if(!r.ok)return toast(r.error||'Falha ao enviar capa');draft.hero=r.hero;updatePreview();toast('✓ Capa enviada. Agora salve as alterações.')}
async function saveAppearance(){draft.font={heading:$('#fontHeading').value,body:$('#fontBody').value};const r=await api('/api/settings/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:draft})});if(!r.ok)return toast(r.error||'Falha ao salvar');data.settings=r.settings;draft=JSON.parse(JSON.stringify(r.settings));toast('✓ Alterações salvas com sucesso')}
async function publishAppearance(){await saveAppearance();const r=await api('/api/settings/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)return toast(r.error||'Falha ao publicar');data.settings=r.settings;draft=JSON.parse(JSON.stringify(r.settings));toast('✓ Aparência publicada para os clientes')}
async function createEvent(){const name=prompt('Nome do evento:');if(!name)return;const r=await api('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:name,name,description:''})});if(!r.ok)return toast(r.error||'Falha');await refresh();toast('✓ Evento criado')}
function selectEvent(id){selectedEvent=id;selectedAlbum=null;renderEvent()}
function renderEvent(){const e=data.events.find(x=>x.id===selectedEvent);$('#workspace').innerHTML=`<button class="btn" style="width:auto" id="back">← Dashboard</button><h2>${esc(e.name)}</h2><p class="status">${esc(e.description||'')}</p><button class="btn primary" style="width:auto" id="newAlbum">+ Novo álbum</button><div class="cards" id="albumCards"></div>`;$('#back').onclick=renderDashboard;$('#newAlbum').onclick=()=>createAlbum(e.id);const g=$('#albumCards');(e.albums||[]).forEach(a=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<strong>${esc(a.name)}</strong><div class="status">${a.media.length} mídias · ${a.published?'🟢 Publicado':'🟡 Rascunho'}</div><button class="btn" style="margin-top:10px;width:auto">Abrir álbum</button>`;c.querySelector('button').onclick=()=>selectAlbum(e.id,a.id);g.appendChild(c)})}
async function createAlbum(eventId){const name=prompt('Nome do álbum:');if(!name)return;const r=await api('/api/albums',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId,name})});if(!r.ok)return toast(r.error||'Falha');await refresh();selectAlbum(eventId,r.album.id);toast('✓ Álbum criado como rascunho')}
function selectAlbum(eventId,albumId){selectedEvent=eventId;selectedAlbum=albumId;selectedIds=new Set();renderAlbum()}
function renderAlbum(){const e=data.events.find(x=>x.id===selectedEvent),a=e?.albums.find(x=>x.id===selectedAlbum);if(!a)return;$('#workspace').innerHTML=`<button class="btn" style="width:auto" id="backAlbum">← Voltar</button><h2>${esc(a.name)}</h2><div class="notice">🟢 Publicado: ${a.published?'sim':'não'} · ${a.media.length} mídias · Selecione itens para ações em lote.</div><div class="field"><label>Adicionar fotos e vídeos</label><input id="files" type="file" multiple accept="image/*,video/*"></div><div class="progress"><i id="progressBar"></i></div><div id="uploadStatus" class="status">Nenhum envio em andamento.</div><div class="toolbar"><button class="btn" style="width:auto" id="selectAll">☑️ SELECIONAR TODAS</button><button class="btn danger" style="width:auto" id="bulkDelete" disabled>🗑️ REMOVER SELECIONADOS</button><button class="btn success" style="width:auto" id="bulkPublish" disabled>🌐 PUBLICAR SELECIONADOS</button><button class="btn" style="width:auto" id="saveOrder">💾 SALVAR ALTERAÇÕES</button><button class="btn primary" style="width:auto" id="publishAlbum">🌐 PUBLICAR ÁLBUM</button><a class="btn" style="width:auto" href="/?event=${encodeURIComponent(e.name)}#galeria" target="_blank">👁 VER COMO CLIENTE</a></div><div class="thumbs" id="thumbs"></div>`;$('#backAlbum').onclick=()=>renderEvent();$('#files').onchange=e2=>uploadFiles(e2.target.files);$('#selectAll').onclick=selectAll;$('#bulkDelete').onclick=bulkDelete;$('#bulkPublish').onclick=()=>bulkPublish(true);$('#saveOrder').onclick=saveOrder;$('#publishAlbum').onclick=publishAlbum;renderThumbs(a);updateBulkButtons()}
function renderThumbs(a){const t=$('#thumbs');t.innerHTML='';a.media.forEach(m=>{const d=document.createElement('div');d.className='thumb'+(selectedIds.has(m.id)?' selected':'');d.dataset.id=m.id;d.draggable=true;d.innerHTML=m.type==='video'?`<video src="${m.url}" muted preload="metadata"></video>`:`<img src="${m.url}" alt="">`;const c=document.createElement('button');c.className='check';c.textContent=selectedIds.has(m.id)?'✓':'□';c.onclick=e=>{e.stopPropagation();toggleSelect(m.id)};const act=document.createElement('div');act.className='actions';const pub=document.createElement('button');pub.textContent=m.published?'🌐':'○';pub.title=m.published?'Despublicar':'Publicar';pub.onclick=e=>{e.stopPropagation();togglePublished(m)};const del=document.createElement('button');del.textContent='🗑';del.title='Remover';del.onclick=e=>{e.stopPropagation();deleteMedia(m)};act.append(pub,del);const badge=document.createElement('span');badge.className='badge';badge.textContent=m.published?'Publicado':'Rascunho';d.append(c,act,badge);d.onclick=()=>{};d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',m.id));d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain');if(from&&from!==m.id)reorder(from,m.id)});t.appendChild(d)})}
function toggleSelect(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);renderAlbum()}
function selectAll(){const a=getAlbum();const all=a.media.length&&a.media.every(m=>selectedIds.has(m.id));selectedIds=all?new Set():new Set(a.media.map(m=>m.id));renderAlbum()}
function getAlbum(){return data.events.find(e=>e.id===selectedEvent)?.albums.find(a=>a.id===selectedAlbum)}function updateBulkButtons(){const d1=$('#bulkDelete'),d2=$('#bulkPublish');if(d1){d1.disabled=!selectedIds.size;d2.disabled=!selectedIds.size;}}
async function uploadFiles(files){if(!files?.length)return;const fd=new FormData();fd.append('eventId',selectedEvent);fd.append('albumId',selectedAlbum);[...files].forEach(f=>fd.append('files',f));$('#uploadStatus').textContent='⏳ Enviando arquivos...';$('#progressBar').style.width='0%';const xhr=new XMLHttpRequest();xhr.open('POST','/api/upload');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=e=>{if(e.lengthComputable)$('#progressBar').style.width=(e.loaded/e.total*100)+'%'};xhr.onload=async()=>{try{const x=JSON.parse(xhr.responseText||'{}');if(!x.ok)return toast(x.error||'Falha no upload');$('#uploadStatus').textContent=`✓ ${x.count} arquivo(s) enviados. Ainda estão em rascunho.`;await refresh();selectedEvent=selectedEvent;selectedAlbum=selectedAlbum;renderAlbum();toast('✓ Upload concluído')}catch{toast('Falha ao ler a resposta do servidor.')}};xhr.onerror=()=>toast('🔴 Falha de rede durante o upload.');xhr.send(fd)}
async function togglePublished(m){const a=getAlbum();const eId=selectedEvent,aId=selectedAlbum;const r=await api(`/api/media/${eId}/${aId}/${m.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({published:!m.published})});if(!r.ok)return toast(r.error||'Falha');await refresh();selectedEvent=eId;selectedAlbum=aId;renderAlbum();toast(r.media.published?'✓ Mídia publicada':'✓ Mídia retirada da publicação')}
async function bulkPublish(state){const r=await api('/api/media/bulk-publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selectedIds],published:state})});if(!r.ok)return toast(r.error||'Falha');selectedIds=new Set();await refresh();renderAlbum();toast(`✓ ${r.changed} mídia(s) atualizadas`)}
async function bulkDelete(){if(!selectedIds.size)return;const n=selectedIds.size;if(!confirm(`Remover ${n} mídia(s) selecionada(s)?`))return;const r=await api('/api/media/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selectedIds]})});if(!r.ok)return toast(r.error||'Falha');selectedIds=new Set();await refresh();renderAlbum();toast(`✓ ${r.removed} mídia(s) removida(s)`)}
async function deleteMedia(m){if(!confirm(`Remover "${m.name}"?`))return;const r=await api(`/api/media/${selectedEvent}/${selectedAlbum}/${m.id}`,{method:'DELETE'});if(!r.ok)return toast(r.error||'Falha');await refresh();renderAlbum();toast('✓ Mídia removida')}
async function reorder(from,to){const a=getAlbum();const ids=a.media.map(m=>m.id);const i=ids.indexOf(from),j=ids.indexOf(to);if(i<0||j<0)return;ids.splice(i,1);ids.splice(j,0,from);const r=await api(`/api/albums/${selectedEvent}/${selectedAlbum}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:ids})});if(!r.ok)return toast(r.error||'Falha');await refresh();renderAlbum();toast('✓ Ordem alterada. Salve para confirmar.')} 
async function saveOrder(){const a=getAlbum();const ids=[...$('#thumbs').children].map(x=>x.dataset.id).filter(Boolean);const r=await api(`/api/albums/${selectedEvent}/${selectedAlbum}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:ids})});if(!r.ok)return toast(r.error||'Falha ao salvar');await refresh();renderAlbum();toast('✓ Alterações salvas com sucesso')}
async function publishAlbum(){const r=await api('/api/publish-album',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:selectedEvent,albumId:selectedAlbum})});if(!r.ok)return toast(r.error||'Falha');await refresh();renderAlbum();toast('✓ Álbum publicado para os clientes')}
if(token){refresh().catch(()=>loginView())}else loginView();
</script></body></html>
